services:
  # app
  app:
    container_name: ri-ifba-app
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - ri-ifba-network

  # nginx
  nginx:
    container_name: ri-ifba-nginx
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8889:80"
      - "445:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ri-ifba-network

  # postgres
  postgres:
    container_name: ri-ifba-postgres
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_ROOT_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - ./.docker/postgres/data:/var/lib/postgresql/data
    ports:
      - "5481:5432"
    networks:
      - ri-ifba-network

  # redis
  redis:
    container_name: ri-ifba-redis
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    restart: always
    ports:
      - "6378:6379"
    networks:
      - ri-ifba-network

networks:
  ri-ifba-network:
    driver: bridge
